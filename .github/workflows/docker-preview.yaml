name: Docker Build and Push Preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Preview Image

    runs-on: ubuntu-latest

    environment:
      name: Preview
      url: https://pr-${{ github.event.pull_request.number }}-unipro-site.unpr.jp

    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Generate preview image tag
        id: image

        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

        shell: bash

        run: |
          set -euo pipefail

          SHORT_SHA="${HEAD_SHA:0:8}"

          TAG="pr-${PR_NUMBER}-${SHORT_SHA}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: registry.uniproject.jp
          username: robot$github-publisher
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Generate Docker metadata
        id: meta

        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6

        with:
          images: registry.uniproject.jp/official/unipro-site

          tags: |
            type=raw,value=${{ steps.image.outputs.tag }}

      - name: Build and push Docker image
        id: build

        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7

        with:
          context: .
          file: ./Dockerfile

          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=registry,ref=registry.uniproject.jp/official/unipro-site:buildcache
          cache-to: type=registry,ref=registry.uniproject.jp/official/unipro-site:buildcache,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign preview image
        env:
          IMAGE: registry.uniproject.jp/official/unipro-site
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}

        shell: bash

        run: |
          set -euo pipefail

          cosign sign --yes \
            "${IMAGE}:${TAG}@${DIGEST}"

name: Approve Preview

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  approve:
    if: >
      github.event.issue.pull_request &&
      github.event.comment.body == '/preview'

    uses: UniPro-tech/PreviewHelper/.github/workflows/approve-environment.yml@v0.1.0

    with:
      approve-environment: Preview

      approvers: '["boardmember"]'

    secrets: inherit

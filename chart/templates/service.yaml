apiVersion: v1
kind: Service
metadata:
  name: {{ include "unipro-site.fullname" . }}
  labels:
    {{- include "unipro-site.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "unipro-site.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater

metadata:
  name: unipro-site
  namespace: argocd

spec:
  namespace: argocd

  applicationRefs:
    - namePattern: "unipro-site"

      images:
        - alias: "unipro-site"
          imageName: "registry.uniproject.jp/official/unipro-site:x.x.x"
          commonUpdateSettings:
            updateStrategy: "semver"

          manifestTargets:
            helm:
              name: "image.repository"
              tag: "image.tag"

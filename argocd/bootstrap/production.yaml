apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unipro-site
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: unipro-site

  source:
    repoURL: https://github.com/UniPro-tech/UniPro-site.git
    targetRevision: master
    path: chart

    helm:
      releaseName: unipro-site
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: unipro-site

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
